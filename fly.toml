# Ajusta `app` si el nombre ya está ocupado globalmente en Fly.io.
app = 'ludus-gym-api'
primary_region = 'iad'

[build]
  dockerfile = 'infra/docker/Dockerfile.api'

[env]
  NODE_ENV = 'production'
  API_PORT = '4000'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
