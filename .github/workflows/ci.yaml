name: CI

on:
  push: { branches: [main, master] }
  pull_request: { branches: [main, master] }

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ludus_gym_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ludus_gym_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ludus_gym_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-access-secret-at-least-32-bytes
      JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-bytes
      QR_HMAC_SECRET: test-qr-secret-at-least-32-bytes
      FIELD_ENCRYPTION_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CSRF_SECRET: test-csrf-secret-at-least-32-bytes
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ludus/api db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @ludus/api db:migrate:test
      - name: Security integration tests
        run: pnpm --filter @ludus/api test:security

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - name: Android SDK (API 36)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - run: cd apps/mobile && sed -i 's/\r$//' ./gradlew && bash ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon

  # iOS queda en espera de la reparación de LudusGYM.xcodeproj (exit 74).
  # No bloquea el lanzamiento web/API/Android, pero el bloqueo queda visible.
  ios:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Pruebas iOS (simulador, sin firma)
        run: >-
          xcodebuild -scheme LudusGYM
          -project apps/mobile-ios/LudusGYM.xcodeproj
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/ludus-ios-derived
          CODE_SIGNING_ALLOWED=NO test
      - name: Archive iOS (sin firma)
        run: >-
          xcodebuild -scheme LudusGYM
          -project apps/mobile-ios/LudusGYM.xcodeproj
          -destination 'generic/platform=iOS'
          -archivePath /tmp/LudusGYM.xcarchive
          CODE_SIGNING_ALLOWED=NO archive
