name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  api-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/api:latest

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
      - name: Restaurar keystore de release
        env:
          KEYSTORE_B64: ${{ secrets.LUDUS_RELEASE_KEYSTORE_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/ludus-signing"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ludus-signing/release.jks"
      - name: Bundle AAB firmado
        working-directory: apps/mobile
        env:
          LUDUS_RELEASE_STORE_FILE: ${{ runner.temp }}/ludus-signing/release.jks
          LUDUS_RELEASE_STORE_PASSWORD: ${{ secrets.LUDUS_RELEASE_STORE_PASSWORD }}
          LUDUS_RELEASE_KEY_ALIAS: ${{ secrets.LUDUS_RELEASE_KEY_ALIAS }}
          LUDUS_RELEASE_KEY_PASSWORD: ${{ secrets.LUDUS_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ludus-gym-aab
          path: apps/mobile/app/build/outputs/bundle/release/*.aab
