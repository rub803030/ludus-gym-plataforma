name: Deploy web

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `vercel build` + `deploy --prebuilt` no funciona con monorepos pnpm
      # fuera de la infraestructura de Vercel (PATH /pnpm9/... hardcodeado).
      # Se invoca desde la raíz del monorepo y Vercel ejecuta installCommand y
      # buildCommand desde apps/web/vercel.json en sus propios servidores.
      - name: Desplegar la consola web en Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_CLI_VERSION: 67.0.0
        run: |
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --yes --prod --token="$VERCEL_TOKEN"
